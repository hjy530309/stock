# Spring Boot / Oracle
spring.datasource.url=jdbc:oracle:thin:@YOUR_DB_ALIAS?TNS_ADMIN=C:/path/to/oracle-wallet
spring.datasource.username=YOUR_DB_USER
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
mybatis.configuration.map-underscore-to-camel-case=true

# KIS API
kis.api.app-key=YOUR_KIS_APP_KEY
kis.api.app-secret=YOUR_KIS_APP_SECRET
kis.api.base-url=https://openapi.koreainvestment.com:9443

# Optional exchange API
exim.api.key=

# Python runtime
# Windows example:
python.path=${user.dir}/.venv/Scripts/python.exe
# macOS/Linux example:
# python.path=${user.dir}/.venv/bin/python

# Asset planner FastAPI
asset.prediction.api-url=http://127.0.0.1:9000/api/asset/predict
asset.prediction.script=${user.dir}/python/ml/asset_api.py
asset.prediction.startup-timeout=12

# Stock AI scripts and model/data files
ai.predict.script=${user.dir}/python/ml/StockTrend.py
ai.predict.model=${user.dir}/python/ml/models/lgbm_model.pkl
ai.predict.sqlite=${user.dir}/python/ml/data/news_data.db
ai.predict.oracle-company=${user.dir}/python/ml/data/oracle_company.csv
ai.predict.oracle-sector=${user.dir}/python/ml/data/oracle_sector.csv
ai.predict.timeout=30
ai.predict.cache-seconds=600

ai.article-impact.script=${user.dir}/python/ml/ArticleImpact.py
ai.article-impact.model=${user.dir}/python/ml/models/article_lgbm_model.pkl
ai.article-impact.cache-seconds=43200
