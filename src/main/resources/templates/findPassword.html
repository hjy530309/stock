<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/findPassword.css}">

    <script type="text/javascript" th:src="@{/js/findPassword.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/guestHeader :: guestHeader('findPassword')}"></div>

<div class="recoveryPage">
    <div class="recoveryWrap">
        <div class="recoveryCard">

            <section class="panel verifyPanel" id="verifyPanel">
                <div class="panelHead">
                    <h1 class="panelTitle">비밀번호 찾기</h1>
                    <p class="panelDesc">가입한 정보를 입력한 뒤 새 비밀번호를 설정해 주세요.</p>
                </div>

                <div class="serverError"
                     th:if="${errorMessage != null}"
                     th:text="${errorMessage}">
                </div>

                <div class="stepIndicator">
                    <div class="stepItem active">
                        <span class="stepCircle">1</span>
                        <span class="stepText">본인 확인</span>
                    </div>
                    <div class="stepLine"></div>
                    <div class="stepItem" id="stepResetLabel">
                        <span class="stepCircle">2</span>
                        <span class="stepText">새 비밀번호</span>
                    </div>
                </div>

                <div class="verifyFormArea">
                    <div class="fieldGroup">
                        <label for="verifyEmail" class="fieldLabel">이메일</label>
                        <input type="email"
                               id="verifyEmail"
                               class="textField"
                               placeholder="이메일을 입력해 주세요">
                    </div>

                    <div class="fieldGroup">
                        <label for="verifyName" class="fieldLabel">이름</label>
                        <input type="text"
                               id="verifyName"
                               class="textField"
                               placeholder="이름을 입력해 주세요">
                    </div>

                    <div class="fieldGroup">
                        <label for="verifyPhone" class="fieldLabel">휴대폰 번호</label>
                        <input type="text"
                               id="verifyPhone"
                               class="textField"
                               placeholder="010-0000-0000"
                               maxlength="13"
                               inputmode="numeric">
                    </div>

                    <p class="messageText errorText" id="verifyMessage"></p>

                    <button type="button" class="primaryBtn" id="moveResetStepBtn">다음</button>
                </div>

                <div class="subLinkRow">
                    <a th:href="@{/login}">로그인</a>
                    <span>|</span>
                    <a th:href="@{/findEmail}">이메일 찾기</a>
                    <span>|</span>
                    <a th:href="@{/register}">회원가입</a>
                </div>
            </section>

            <section class="panel resetPanel hidden" id="resetPanel">
                <div class="panelHead">
                    <h1 class="panelTitle">새 비밀번호 설정</h1>
                    <p class="panelDesc">확인된 계정의 비밀번호를 새로 설정합니다.</p>
                </div>

                <div class="stepIndicator">
                    <div class="stepItem complete">
                        <span class="stepCircle">1</span>
                        <span class="stepText">본인 확인</span>
                    </div>
                    <div class="stepLine active"></div>
                    <div class="stepItem active">
                        <span class="stepCircle">2</span>
                        <span class="stepText">새 비밀번호</span>
                    </div>
                </div>

                <div class="summaryBox">
                    <div class="summaryLabel">확인된 계정</div>
                    <div class="summaryValue" id="summaryEmail">example@domain.com</div>
                </div>

                <form id="resetPasswordForm"
                      th:action="@{/findPassword}"
                      method="post"
                      onsubmit="return validateResetPasswordForm();">

                    <input type="hidden" name="userEmail" id="hiddenUserEmail">
                    <input type="hidden" name="userName" id="hiddenUserName">
                    <input type="hidden" name="userPhone" id="hiddenUserPhone">

                    <div class="fieldGroup">
                        <label for="newPassword" class="fieldLabel">새 비밀번호</label>
                        <input type="password"
                               id="newPassword"
                               name="newPassword"
                               class="textField"
                               placeholder="새 비밀번호를 입력해 주세요">
                    </div>

                    <div class="fieldGroup">
                        <label for="reNewPassword" class="fieldLabel">비밀번호 확인</label>
                        <input type="password"
                               id="reNewPassword"
                               name="reNewPassword"
                               class="textField"
                               placeholder="비밀번호를 다시 입력해 주세요">
                    </div>

                    <p class="messageText errorText" id="resetMessage"></p>

                    <div class="btnRow">
                        <button type="button" class="subBtn" id="goPrevBtn">이전</button>
                        <button type="submit" class="primaryBtn halfBtn">비밀번호 변경</button>
                    </div>
                </form>
            </section>

        </div>
    </div>
</div>

</body>
</html>
